# 依存と GitHub Actions の更新を、週に1回 PR で受け取る。
# PR では CI（check・単体テスト・build・E2E）が走る。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    # コミットメッセージのルール（<種類>: <説明>）に合わせ、build(deps): … / build(deps-dev): … の形にする
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Vite+ は vite の別名・overrides・CI の setup-vp と版をそろえる必要があるため、手で上げる
      - dependency-name: vite
      - dependency-name: vite-plus
      # markuplint の JSX パーサーが TypeScript 6 系の JS API を使うため、7 には上げない
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # stylelint-config-recess-order が stylelint 18 に未対応のため、major には上げない。
      # recess-order の更新 PR が来て peer に ^18 が入ったら、この2件を外して一緒に上げる
      - dependency-name: stylelint
        update-types: ["version-update:semver-major"]
      - dependency-name: stylelint-config-standard
        update-types: ["version-update:semver-major"]
    groups:
      # minor・patch は1つの PR にまとめる。major は1件ずつ
      minor-and-patch:
        update-types: [minor, patch]
  # SHA で固定した Actions の更新（ハッシュと、横に書いた版のコメントを書き換える）
  - package-ecosystem: github-actions
    directory: /
    # ci(deps): … の形にする
    commit-message:
      prefix: ci
      include: scope
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
